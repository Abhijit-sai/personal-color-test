name: Push to Replicate

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  push_to_replicate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Cog
        uses: replicate/setup-cog@v1
        with:
          token: ${{ secrets.REPLICATE_API_TOKEN }}

      - name: Push to Replicate
        run: |
          cog push r8.im/abhijit-sai/personal-color-test
        env:
          # This token is used to authenticate with Replicate
          # You must add REPLICATE_API_TOKEN to your GitHub Repository Secrets
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
